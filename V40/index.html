<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Novatrix kundtjänst</title>
<style>
html { color-scheme: light dark; }
body { width: 35em; margin: 0 auto; font-family: Tahoma, Verdana, Arial, sans-serif; }
</style>
</head>
<body>
<h1>Novatrix kundtjänst</h1>
<p>Skicka in ett ärende så återkommer vi så snart vi kan.</p>
<p><small>Körs som container i Azure Container Instances (V40).</small></p>
<form method="get">
<label for="name">Namn</label><br>
<input type="text" id="name" name="name" required><br>
<label for="mail">Mail</label><br>
<input type="text" id="mail" name="mail" required><br>
<label for="msg">Meddelande</label><br>
<textarea id="msg" name="msg" rows="4" cols="50"></textarea><br><br>
<input type="submit" value="Skicka ärende">
</form>
</body>
</html>
