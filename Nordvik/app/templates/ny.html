{% extends "base.html" %}
{% block innehall %}
<h1>Ny felanmälan</h1>
<p class="info">Vid akuta fel som vattenläcka, strömavbrott eller att du inte kommer in i lägenheten: ring också jouren på 010-123 45 00.</p>
{% if fel %}<p class="fel">{{ fel }}</p>{% endif %}
<form method="post" enctype="multipart/form-data">
  <label for="fastighet">Fastighet</label>
  <select id="fastighet" name="fastighet" required>
    <option value="">Välj...</option>
    {% for f in fastigheter %}<option {% if varden.fastighet == f %}selected{% endif %}>{{ f }}</option>{% endfor %}
  </select>
  <label for="lagenhet">Lägenhets- eller lokalnummer</label>
  <input id="lagenhet" name="lagenhet" maxlength="20" value="{{ varden.lagenhet }}">
  <label for="kategori">Kategori</label>
  <select id="kategori" name="kategori" required>
    <option value="">Välj...</option>
    {% for k in kategorier %}<option {% if varden.kategori == k %}selected{% endif %}>{{ k }}</option>{% endfor %}
  </select>
  <label for="rubrik">Rubrik</label>
  <input id="rubrik" name="rubrik" maxlength="120" required value="{{ varden.rubrik }}">
  <label for="beskrivning">Beskrivning</label>
  <textarea id="beskrivning" name="beskrivning" rows="6" maxlength="4000" required>{{ varden.beskrivning }}</textarea>
  <label for="bild">Bild på felet (JPG, PNG, WebP eller HEIC, max 10 MB)</label>
  <input id="bild" name="bild" type="file" accept="image/jpeg,image/png,image/webp,image/heic">
  <label class="rad"><input type="checkbox" name="tilltrade" value="ja"> Förvaltaren får gå in med huvudnyckel om jag inte är hemma</label>
  <button type="submit">Skicka felanmälan</button>
</form>
{% endblock %}
